<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ed" />
    <meta name="description" content="Un regalito para Anny. Una cartita, muchos deseos y unas cuantas sorpresitas. Con cariño, Luis." />
    <meta name="robots" content="noindex, nofollow, noimageindex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Un regalito para Anny 💌" />
    <meta property="og:description" content="Hoy todo esto es para ti. Con cariño, Luis." />
    <meta property="og:url" content="https://smakcsgch.github.io/un-regalito-para-anny/" />
    <meta property="og:image" content="https://smakcsgch.github.io/un-regalito-para-anny/assets/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <title>Un regalito para Anny 💌</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preload" href="./assets/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="paper-texture" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#sobre" aria-label="Un regalito para Anny, volver al sobre"><span class="brand-flower" aria-hidden="true">✿</span><span>un regalito <i>para Anny</i></span></a>
      <button class="music-toggle" id="music" type="button" aria-pressed="false" aria-label="Activar música"><span id="music-icon" aria-hidden="true">♪</span><span id="music-label">Música apagada</span></button>
    </header>
    <main id="app"></main>
    <footer class="footer"><span class="footer-line"></span><span>De Luis, con cariño <span aria-hidden="true">♡</span></span><span class="footer-line"></span></footer>
    <div id="particles" class="particles" aria-hidden="true"></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="photo-dialog" aria-labelledby="photo-dialog-title">
      <div class="lightbox-top"><span id="photo-dialog-title">Un recuerdito bonito</span><button id="close-photo" class="icon-button" type="button" aria-label="Cerrar foto ampliada">✕</button></div>
      <img id="large-photo" alt="" />
      <span id="lightbox-count" class="lightbox-count"></span>
    </dialog>
    <noscript><p class="noscript">Anny, activa JavaScript para abrir tu regalito 💌</p></noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
